# Codemagic 云构建配置 —— 免费方案产出未签名 IPA
# 用法：把项目推到 GitHub/GitLab 私有库 → Codemagic 里 Add app 选中本文件 → Start build
# 免费额度：500 macOS M2 分钟/月，本构建约 7-15 分钟，够打 20+ 次
# 详细装机步骤见项目根目录文档《iPad 测试包构建与安装指南.md》

workflows:
  ios-ipa-unsigned:
    name: iOS IPA (unsigned, for sideload)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # Flutter 3.50.0 / Dart 3.14.0，与本地一致；锁 stable 避免漂移
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter 版本
        script: flutter --version
      - name: 获取依赖
        script: flutter pub get
      - name: iOS 部署目标对齐 Pod
        # 插件 flutter_midi_command_ble 等要求较高 iOS 版本；工程是 15.0，
        # 若 CocoaPods 报最低版本冲突，把下面 15.0 改成插件要求值（如 16.0）重试。
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: 构建未签名 .app
        # 未签名构建只能用 flutter build ios --no-codesign，产物是 .app。
        # flutter build ipa 需要签名/归档流程，免费个人账号在云端跑不通。
        script: flutter build ios --release --no-codesign
      - name: 把 .app 打包成标准 .ipa
        # .app 不能直接给 Sideloadly 用，需按 Apple 的 IPA 结构打包：
        # Payload/Runner.app 打成 zip 再改后缀 .ipa。
        script: |
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "找不到 .app 产物"; exit 1; fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -q -r runner-unsigned.ipa Payload
          cd "$CM_BUILD_DIR"
          echo "IPA 已生成: $(ls -lh build/ios/ipa/runner-unsigned.ipa)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      scripts:
        # 构建完成后在 Codemagic 页面点 Artifacts 直接下载 IPA。
        # 如需自动发邮件/钉钉，可在这里加，不影响装机。
        - echo "IPA 已生成，请在 Artifacts 下载"
