name: sight_reading
description: "识谱训练 MVP — 离线单机识谱训练应用（02-MVP功能规格）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# 依赖清单权威：开发资料/03-技术架构与选型.md §1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.1.0
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.0
  sqflite_common: ^2.5.0
  path_provider: ^2.1.0
  flutter_soloud: ^3.0.0
  share_plus: ^13.0.0
  file_picker: ^13.4.0
  # 蓝牙电钢琴（BLE-MIDI，Roland FP-18 等）。BLE 传输拆在独立包（1.x 起）。
  flutter_midi_command: ^1.4.0
  flutter_midi_command_ble: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  sqflite_common_ffi: ^2.3.0

# 真机（Android 16 / API 36）上 path_provider_android 2.3.x 通过 jni 取 Context，
# 报 ClassNotFoundException: android/content/Context（jni 用 app classloader FindClass）。
# 固定到 2.2.x（MethodChannel 实现，无 jni 依赖）。
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/licenses/
    - assets/scores/
  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf